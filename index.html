    <!-- Fraunces — hallmark's editorial display face. Variable, with SOFT and
         WONK axes: SOFT rounds the terminals, WONK lets the italic-ish quirks
         through. That's where the warmth comes from, rather than from a script
         or a high-contrast luxury serif (which read as "menu", not portfolio). -->
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,300..700,0..100,0..1&display=swap"
      rel="stylesheet"
    />
    <!-- Switzer (Fontshare, free for commercial use) — hallmark's editorial
         body sans. Neutral enough to disappear behind the display face. -->
    <link
      href="https://api.fontshare.com/v2/css?f[]=switzer@300,400,500,600&display=swap"
      rel="stylesheet"
    />
